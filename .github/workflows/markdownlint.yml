name: Markdownlint Reusable

on:
  workflow_call:
    inputs:
      markdownlint_config:
        description: Path to markdownlint configuration file
        required: false
        type: string
        default: ".markdownlint.json"
      include_glob:
        description: Glob passed to markdownlint-cli2 for included files
        required: false
        type: string
        default: "**/*.md"
      exclude_glob:
        description: Space-separated markdownlint-cli2 ignore globs prefixed with '#'
        required: false
        type: string
        default: "#node_modules #.git"
      base_sha:
        description: Optional base SHA for diff-based applicability gating
        required: false
        type: string
        default: ""
      head_sha:
        description: Optional head SHA for diff-based applicability gating
        required: false
        type: string
        default: ""
      scope_mode:
        description: >-
          Enforcement scope for scoped runs: changed-files (default) or
          changed-lines (only fail on edited lines when base/head are present)
        required: false
        type: string
        default: "changed-files"

permissions:
  contents: read

jobs:
  markdownlint:
    name: Markdownlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect markdownlint scope changes
        id: scope
        shell: bash
        env:
          INPUT_BASE_SHA: ${{ inputs.base_sha }}
          INPUT_HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail

          BASE_SHA="$INPUT_BASE_SHA"
          HEAD_SHA="$INPUT_HEAD_SHA"

          if [[ -z "$BASE_SHA" || -z "$HEAD_SHA" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "scope_reason=no base/head provided; full lint" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git rev-parse --verify "$BASE_SHA" >/dev/null 2>&1; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "scope_reason=base sha unavailable locally; full lint" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git rev-parse --verify "$HEAD_SHA" >/dev/null 2>&1; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "scope_reason=head sha unavailable locally; full lint" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          lint_scope="$(printf '%s\n' "$changed_files" | grep -E '(^|/)\.markdownlint\.json$|(^|/)\.markdownlintignore$|\.md$' || true)"

          if [[ -n "$lint_scope" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"

            # Determine whether a markdownlint config file changed; if so we
            # must re-lint every .md file (config change could affect all files).
            config_changed="$(printf '%s\n' "$lint_scope" | grep -E '(^|/)\.markdownlint\.json$|(^|/)\.markdownlintignore$' || true)"
            if [[ -n "$config_changed" ]]; then
              echo "scope_reason=markdownlint config changed; full lint" >> "$GITHUB_OUTPUT"
              echo "lint_files=" >> "$GITHUB_OUTPUT"
            else
              # Only .md files changed — pass their paths so lint is scoped.
              md_files="$(printf '%s\n' "$lint_scope" | grep '\.md$' | tr '\n' ' ' | sed 's/ $//')"
              echo "scope_reason=markdown change detected; scoped lint" >> "$GITHUB_OUTPUT"
              echo "lint_files=$md_files" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "scope_reason=no markdown/config changes" >> "$GITHUB_OUTPUT"
            echo "lint_files=" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.scope.outputs.should_run == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"

      - name: Install markdownlint-cli2
        if: steps.scope.outputs.should_run == 'true'
        run: npm install -g markdownlint-cli2@0.18.1

      - name: Lint Markdown
        if: steps.scope.outputs.should_run == 'true'
        shell: bash
        env:
          INPUT_EXCLUDE_GLOB: ${{ inputs.exclude_glob }}
          INPUT_INCLUDE_GLOB: ${{ inputs.include_glob }}
          INPUT_MARKDOWNLINT_CONFIG: ${{ inputs.markdownlint_config }}
          INPUT_BASE_SHA: ${{ inputs.base_sha }}
          INPUT_HEAD_SHA: ${{ inputs.head_sha }}
          INPUT_SCOPE_MODE: ${{ inputs.scope_mode }}
          SCOPE_LINT_FILES: ${{ steps.scope.outputs.lint_files }}
        run: |
          set -euo pipefail

          IFS=' ' read -r -a excludes <<< "$INPUT_EXCLUDE_GLOB"
          BASE_SHA="$INPUT_BASE_SHA"
          HEAD_SHA="$INPUT_HEAD_SHA"
          SCOPE_MODE="$INPUT_SCOPE_MODE"

          # When base/head SHAs were provided and only .md files changed, lint
          # only those changed files.  When a markdownlint config file changed
          # (or no SHAs were provided), lint_files is empty and we fall back to
          # the full include_glob so every file is checked against the new config.
          lint_files="$SCOPE_LINT_FILES"

          if [[ -n "$lint_files" ]]; then
            # Scoped lint: build args from the changed-file list.
            IFS=' ' read -r -a file_args <<< "$lint_files"
            lint_args=("${file_args[@]}")
          else
            # Full lint: use the caller-supplied glob.
            lint_args=("$INPUT_INCLUDE_GLOB")
          fi

          for pattern in "${excludes[@]}"; do
            [[ -n "$pattern" ]] && lint_args+=("$pattern")
          done

          if [[ "$SCOPE_MODE" != "changed-files" && "$SCOPE_MODE" != "changed-lines" ]]; then
            echo "Invalid scope_mode: $SCOPE_MODE (expected changed-files or changed-lines)" >&2
            exit 2
          fi

          mdcmd=(markdownlint-cli2 "${lint_args[@]}")
          if [[ -f "$INPUT_MARKDOWNLINT_CONFIG" ]]; then
            mdcmd+=(--config "$INPUT_MARKDOWNLINT_CONFIG")
          fi

          # Default contract: full-file lint against scoped files.
          if [[ "$SCOPE_MODE" != "changed-lines" || -z "$lint_files" || -z "$BASE_SHA" || -z "$HEAD_SHA" ]]; then
            "${mdcmd[@]}"
            exit 0
          fi

          # Changed-lines mode: filter lint failures to edited lines only.
          issues_file="$(mktemp)"
          if "${mdcmd[@]}" >"$issues_file" 2>&1; then
            rm -f "$issues_file"
            exit 0
          fi

          changed_lines_file="$(mktemp)"
          while IFS= read -r file; do
            [[ -n "$file" ]] || continue
            git diff -U0 "$BASE_SHA" "$HEAD_SHA" -- "$file" \
              | awk -v f="$file" '
                  /^@@ / {
                    line=$0
                    sub(/^.*\+/, "", line)
                    sub(/ .*/, "", line)
                    split(line, parts, ",")
                    start=parts[1]+0
                    count=(parts[2]=="" ? 1 : parts[2]+0)
                    if (count > 0) {
                      for (i=0; i<count; i++) print f":"(start+i)
                    }
                  }
                '
          done <<< "$(printf '%s' "$lint_files" | tr ' ' '\n')" \
            | sort -u > "$changed_lines_file"

          filtered_count=0
          while IFS= read -r line; do
            if [[ "$line" =~ ^([^:]+):([0-9]+)(:[0-9]+)?[[:space:]] ]]; then
              key="${BASH_REMATCH[1]}:${BASH_REMATCH[2]}"
              if grep -Fxq "$key" "$changed_lines_file"; then
                echo "$line"
                filtered_count=$((filtered_count + 1))
              fi
            fi
          done < "$issues_file"

          rm -f "$issues_file" "$changed_lines_file"

          if [[ "$filtered_count" -gt 0 ]]; then
            echo "Changed-lines mode: $filtered_count violation(s) on edited lines." >&2
            exit 1
          fi

          echo "Changed-lines mode: no violations on edited lines. Historical unchanged-line debt ignored."

      - name: Mark as not applicable
        if: steps.scope.outputs.should_run != 'true'
        run: |
          echo "Markdownlint not applicable for this diff."

      - name: Report summary
        if: always()
        env:
          SCOPE_SHOULD_RUN: ${{ steps.scope.outputs.should_run }}
          SCOPE_REASON: ${{ steps.scope.outputs.scope_reason }}
          INPUT_SCOPE_MODE: ${{ inputs.scope_mode }}
          SCOPE_LINT_FILES: ${{ steps.scope.outputs.lint_files }}
        run: |
          echo "## Markdownlint Reusable" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Applicable: $SCOPE_SHOULD_RUN ($SCOPE_REASON)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Scope mode: $INPUT_SCOPE_MODE" >> "$GITHUB_STEP_SUMMARY"
          lint_files="$SCOPE_LINT_FILES"
          if [[ -n "$lint_files" ]]; then
            echo "- Scope: changed files only" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Scope: full repo glob" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- Runner: ubuntu-latest" >> "$GITHUB_STEP_SUMMARY"
          echo "- Secrets: none" >> "$GITHUB_STEP_SUMMARY"
